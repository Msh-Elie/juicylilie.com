  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      min-height: 100%;
      min-height: 100dvh;
      background: #000;
      font-family: Arial, sans-serif;
      color: #fff;
      overflow-x: hidden;
    }

    .page {
      min-height: 100vh;
      min-height: 100dvh;
      position: relative;
      background: #000;
      display: flex;
      flex-direction: column;
    }

    .bg-blur {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center top;
      filter: blur(30px) brightness(0.4);
      pointer-events: none;
      user-select: none;
      z-index: 0;
      transform: scale(1.05);
    }

    .card {
      position: relative;
      z-index: 10;
      width: 420px;
      max-width: 95vw;
      margin: 0 auto;
      background: #000;
      border-radius: 24px;
      overflow: hidden;
      min-height: 80vh;
      min-height: 80dvh;
      display: flex;
      flex-direction: column;
    }

    /* ─── COVER : photo entière, ratio naturel ─── */
    .cover {
      position: relative;
      overflow: hidden;
      line-height: 0;
      flex-shrink: 0;
      background: #000;
    }

    .cover img.cover-photo {
      position: relative;
      display: block;
      width: 100%;
      height: auto;
    }

    .cover::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(to top,
        #000 0%,
        rgba(0,0,0,0.7) 8%,
        rgba(0,0,0,0.25) 22%,
        transparent 40%
      );
      pointer-events: none;
      z-index: 2;
    }

    .cover-info {
      position: absolute;
      bottom: 0; left: 0;
      width: 100%;
      padding: 0 16px 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      z-index: 3;
    }

    .cover-name-row {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 14px;
    }

    .cover-name-row h1 {
      font-size: 46px;
      font-family: Arial, sans-serif;
      font-weight: 600;
      color: #fff;
      text-shadow: 2px 2px 19px rgba(11,11,11,1);
      line-height: 1.1;
    }

    .blue-tick {
      width: 24px; height: 24px;
      object-fit: contain;
      flex-shrink: 0;
    }

    .online-badge {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      background: #fff;
      border-radius: 999px;
      padding: 6px 16px 6px 12px;
      margin: 0 0 26px;
    }

    .dot-wrap { position: relative; width: 12px; height: 12px; flex-shrink: 0; }
    .dot {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      background: rgb(34,197,94);
    }
    .dot-ping {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      background: rgb(34,197,94);
      opacity: 0.7;
      animation: ping 2s cubic-bezier(0,0,0.8,1) infinite;
    }
    @keyframes ping {
      0%   { transform: scale(1); opacity: 0.7; }
      75%, 100% { transform: scale(2.2); opacity: 0; }
    }
    .online-badge span {
      color: #1f2937;
      font-size: 13px;
      font-weight: 600;
      white-space: nowrap;
    }

    /* ─── ZONE CENTRALE : centre la carte Telegram verticalement ─── */
    .main-content {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 28px 16px;
    }

    /* ─── CARTE TELEGRAM STYLÉE (sans photo) ─── */
    .telegram-card {
      display: flex;
      align-items: center;
      gap: 14px;
      width: 100%;
      padding: 16px 18px;
      border-radius: 22px;
      background: linear-gradient(135deg, #2AABEE 0%, #229ED9 100%);
      border: 1.5px solid rgba(255,255,255,0.18);
      text-decoration: none;
      color: #fff;
      box-shadow: 0 12px 32px rgba(42,171,238,0.35);
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .telegram-card:hover {
      transform: translateY(-2px) scale(1.02);
      box-shadow: 0 18px 44px rgba(42,171,238,0.5);
    }

    .tg-icon {
      width: 46px;
      height: 46px;
      border-radius: 50%;
      background: rgba(255,255,255,0.22);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .tg-icon svg {
      width: 24px;
      height: 24px;
      fill: #fff;
    }

    .tg-text {
      flex: 1;
      min-width: 0;
      text-align: left;
    }

    .tg-text h3 {
      font-size: 17px;
      font-weight: 700;
      margin-bottom: 3px;
      color: #fff;
      line-height: 1.2;
    }

    .tg-text p {
      font-size: 13px;
      color: rgba(255,255,255,0.9);
      font-weight: 500;
    }

    .tg-arrow {
      width: 22px;
      height: 22px;
      flex-shrink: 0;
      opacity: 0.95;
    }

    .tg-arrow svg {
      width: 100%;
      height: 100%;
      stroke: #fff;
    }

    .page-footer {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      font-size: 12px;
      opacity: 0.15;
      color: rgba(255,255,255,0.9);
      padding: 20px 0 24px;
      flex-shrink: 0;
    }
    .page-footer a { color: inherit; text-decoration: underline; }

    @media (max-width: 480px) {
      .card {
        width: 100%;
        max-width: 100%;
        border-radius: 0;
        min-height: 100dvh;
      }
      .page { min-height: 100dvh; }
      .cover-name-row h1 { font-size: 38px; }
    }
  </style>
</head>
<body>

    </div>

  </div>
</div>

<script>
  // ── Tracking clic Telegram ──
  (function() {
    const tg = document.querySelector('.telegram-card');
    if (!tg) return;
    tg.addEventListener('click', function() {
      const label = tg.getAttribute('data-label') || 'Telegram';
      if (typeof fbq !== 'undefined') {
        fbq('track', 'Lead', {
          content_name: label,
          content_category: 'telegram_link'
        });
      }
    });
  })();
</script>
